name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please keep in mind that Picasso
        is a volunteer-driven project - the narrower and better-motivated the
        scope, the more likely it is that someone can implement it.

        Before submitting, please search the
        [existing issues](https://github.com/jungmannlab/picasso/issues?q=is%3Aissue)
        to check whether the feature has already been requested.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >
        What are you trying to achieve, and what makes it difficult or
        impossible today? Please describe the scientific or practical use case
        rather than only the proposed solution.
      placeholder: >
        When tiling particles on a square grid I always need to export the
        picked localizations first, because there is no way to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        Explain in detail how the feature would work - where it would live in
        the GUI or API, what the inputs and outputs are, and how a user would
        interact with it. If you're not a coder - don't worry! Just give a
        big picture for us to get started on.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of Picasso would this feature belong to?
      multiple: true
      options:
        - "Localize"
        - "Filter"
        - "Render"
        - "Average"
        - "SPINNA"
        - "Nanotron"
        - "Design"
        - "Simulate"
        - "Server / watcher"
        - "Command line interface (picasso ...)"
        - "Python API (import picasso...)"
        - "Plugins"
        - "Documentation"
        - "Other / not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other ways of solving the same problem, including workarounds you
        currently use or other software that implements something similar.

  - type: textarea
    id: references
    attributes:
      label: References
      description: >
        Publications, algorithms or existing implementations that describe the
        method, if applicable. Mockups and screenshots are welcome too.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on a pull request for this feature.
